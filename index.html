<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ons Gezin</title>
<style>
:root{
  --bg:#f7f3ed;
  --card:#ffffff;
  --text:#252525;
  --muted:#6f6b66;
  --line:#e5ded5;
  --accent:#8a6e54;
  --soft:#efe7de;
  --ok:#dcefdc;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,select,input,textarea{font:inherit}
.app{max-width:1000px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:28px;margin:0}
.sub{color:var(--muted);font-size:14px}
.modebar,.days,.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;cursor:pointer}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.days button{min-width:86px}
.panel{display:none}.panel.active{display:block}
.schedule{display:grid;gap:10px;margin-top:14px}
.row{display:grid;grid-template-columns:118px 1fr auto auto;gap:12px;align-items:center;background:var(--card);padding:14px;border-radius:18px;border:1px solid var(--line)}
.time{font-weight:700;color:var(--accent)}
.title{font-weight:700;font-size:17px}
.detail{color:var(--muted);font-size:14px;margin-top:3px}
.paperclip{font-size:22px;padding:8px 11px}
.done{width:26px;height:26px}
.done:checked + .dummy{}
.row.completed{opacity:.58;background:var(--ok)}
.sectionTitle{margin:24px 0 8px;font-size:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:700;margin-bottom:6px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{min-height:110px;resize:vertical}
.childWrap{min-height:78vh;display:grid;place-items:center}
.childCard{width:min(820px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;text-align:center}
.childEmoji{font-size:76px}.childTime{font-size:22px;color:var(--muted);margin-top:8px}.childTitle{font-size:42px;font-weight:800;margin:16px 0}.childNext{font-size:22px;color:var(--muted);margin-top:24px}.bigDone{font-size:24px;padding:16px 28px;border-radius:18px;background:var(--accent);color:#fff;border:0}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:20}.drawer.open{display:flex}.sheet{width:min(900px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px}.sheet h2{margin-top:0}.sheet .close{float:right}
.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.infoBlock{background:var(--soft);border-radius:14px;padding:14px}.infoBlock h3{margin:0 0 8px;font-size:16px}.infoBlock p{margin:0;white-space:pre-wrap}
.small{font-size:13px;color:var(--muted)}
.topnote{background:#fff7d7;border:1px solid #eadf9f;padding:12px 14px;border-radius:14px;margin:10px 0 14px}
.viewbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.memrow{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center;background:#fff;padding:14px;border-radius:18px;border:1px solid var(--line)}.memrow.house{background:#fbf8f4}.memrow.sport{background:#f7faf7}.memrow.spanish{background:#fffaf0}.memrow.dog{background:#f7f9fb}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--soft);font-size:12px;color:var(--muted);margin-top:6px}.miniActions{display:flex;gap:6px}.miniActions button{padding:7px 10px;border-radius:10px}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.row{grid-template-columns:92px 1fr auto}.row .done{grid-column:3}.row .paperclip{grid-column:3}.grid2,.infoGrid{grid-template-columns:1fr}.childTitle{font-size:34px}.days{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a6e54">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>🌈 Ons Gezin</h1>
    <div class="sub">Weekplanner voor mem, kinderen en Newline</div>
  </div>
  <div class="modebar">
    <button id="parentBtn" class="active">👩‍👧 Oudermodus</button>
    <button id="childBtn">🧒 Kindmodus</button>
  </div>
</header>

<div id="parentPanel" class="panel active">
  <div class="days" id="days"></div>
  <div class="topnote" id="parentNote">📎 Tik op de paperclip bij een activiteit om extra informatie, uitleg of een recept te openen.</div>
  <div class="schedule" id="schedule"></div>
  <div class="actions" style="margin-top:14px">
    <button id="resetDay">↺ Dag resetten</button>
    <button id="exportBtn">⬇️ Planning exporteren</button>
    <button id="importBtn">⬆️ Planning importeren</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</div>

<div id="childPanel" class="panel">
  <div class="days" id="childDays"></div>
  <div class="childWrap">
    <div class="childCard">
      <div class="childEmoji" id="childEmoji">🌞</div>
      <div class="childTime" id="childTime"></div>
      <div class="childTitle" id="childTitle"></div>
      <button class="bigDone" id="childDone">✓ Klaar</button>
      <div class="childNext" id="childNext"></div>
    </div>
  </div>
</div>
</div>

<div class="drawer" id="drawer">
  <div class="sheet">
    <button class="close" id="closeDrawer">✕</button>
    <h2 id="sheetTitle"></h2>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
const dayNames=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
const learning={
  Maandag:{title:'🧮 Rekenen + fruit + drinken', activity:'Kleuren sorteren', emoji:'🧮', info:{
    doel:'Kleuren herkennen, benoemen en sorteren.',
    materialen:'Gekleurde blokken, bekers of kaartjes in 3–5 kleuren.',
    voorbereiding:'Leg per kleur een bakje of vel papier klaar.',
    stappen:'1. Kies samen een kleur.\n2. Laat de kinderen voorwerpen met die kleur zoeken.\n3. Sorteer alles per kleur.\n4. Tel samen hoeveel voorwerpen er per kleur zijn.',
    vragen:'Welke kleur is dit?\nWaar hoort deze bij?\nWelke kleur hebben we het meest?',
    aanpassing35:'Laat je oudste ook tellen en twee kleuren vergelijken.',
    aanpassing2:'Gebruik 2–3 duidelijke kleuren en laat vooral aanwijzen en sorteren.',
    baby:'Laat de baby veilig meekijken/voelen aan grote gekleurde voorwerpen.',
    duur:'20–30 minuten actief, daarna fruit/drinken.',
    extra:'Maak aan het einde een eenvoudig kleurenpatroon.',
    laagenergie:'Alleen 6–8 voorwerpen sorteren aan tafel.'
  }},
  Dinsdag:{title:'🇬🇧 Engels + fruit + drinken', activity:'Find the colour', emoji:'🇬🇧', info:{
    doel:'Engelse kleurwoorden horen, herkennen en herhalen.', materialen:'Gekleurde voorwerpen in huis.', voorbereiding:'Kies 3 kleuren: red, blue, yellow.',
    stappen:'1. Zeg: “Find red.”\n2. Laat een voorwerp zoeken.\n3. Herhaal: “This is red.”\n4. Wissel kleuren af.', vragen:'What colour is it?\nCan you find blue?',
    aanpassing35:'Laat je oudste zelf “red/blue/yellow” zeggen.', aanpassing2:'Aanwijzen is voldoende; jij benoemt de kleur.', baby:'Laat de baby naar het voorwerp kijken terwijl jij de kleur benoemt.', duur:'15–25 minuten.', extra:'Voeg green en orange toe.', laagenergie:'Doe dit zittend met 5 voorwerpen.'
  }},
  Woensdag:{title:'🙏 Godsdienst + fruit + drinken', activity:'God maakte de kleuren', emoji:'🙏', info:{
    doel:'Stilstaan bij de schepping en dankbaarheid.', materialen:'Kleurenkaartjes of voorwerpen uit de natuur.', voorbereiding:'Leg 4–5 kleuren klaar.',
    stappen:'1. Kijk samen naar de kleuren.\n2. Benoem dat God de wereld mooi en verschillend heeft gemaakt.\n3. Ieder kind kiest een favoriete kleur.\n4. Sluit af met een kort dankmoment.', vragen:'Welke kleur vind jij mooi?\nWaar zie je die kleur buiten?',
    aanpassing35:'Laat je oudste één ding noemen waarvoor ze dankbaar is.', aanpassing2:'Laat kiezen en nazeggen.', baby:'Laat de baby meekijken naar contrastrijke kleuren.', duur:'15–20 minuten.', extra:'Ga buiten op kleurenzoektocht.', laagenergie:'Kort gesprek met 3 kleurkaartjes.'
  }},
  Donderdag:{title:'🇪🇸 Spaans + fruit + drinken', activity:'Los colores', emoji:'🇪🇸', info:{
    doel:'Basisnamen van kleuren in het Spaans leren.', materialen:'Rode, blauwe en gele voorwerpen.', voorbereiding:'Leg rojo, azul en amarillo klaar.',
    stappen:'1. Zeg: “Rojo – rood.”\n2. Laat aanwijzen.\n3. Vraag: “¿Dónde está el rojo?”\n4. Herhaal met azul en amarillo.', vragen:'¿Qué color es? = Welke kleur is het?\n¿Dónde está el azul? = Waar is blauw?',
    aanpassing35:'Laat je oudste het Spaanse woord herhalen.', aanpassing2:'Aanwijzen is voldoende.', baby:'Benoem zacht de kleur van wat de baby vasthoudt.', duur:'15–25 minuten.', extra:'Voeg verde en naranja toe.', laagenergie:'Alleen 3 voorwerpen benoemen.'
  }},
  Vrijdag:{title:'🔬 Ontdekken & toepassen + fruit + drinken', activity:'Zelf kleuren mengen', emoji:'🔬', info:{
    doel:'Ontdekken wat er gebeurt wanneer kleuren worden gemengd.', materialen:'Water, doorzichtige bekertjes, voedselkleurstof of kinderverf, lepeltjes.', voorbereiding:'Zet handdoek/onderlegger klaar.',
    stappen:'1. Maak rood, geel en blauw water/verf.\n2. Meng rood + geel.\n3. Vraag wat er gebeurt.\n4. Herhaal met andere combinaties.', vragen:'Welke nieuwe kleur zie je?\nWat denk je dat blauw + geel wordt?',
    aanpassing35:'Laat voorspellen vóór het mengen.', aanpassing2:'Laat onder begeleiding roeren en kijken.', baby:'Laat alleen kijken op veilige afstand.', duur:'25–35 minuten.', extra:'Maak een eigen kleurenkaart.', laagenergie:'Meng slechts één kleurencombinatie.'
  }},
  Zaterdag:{title:'📚 Vrij ontdekken + fruit + drinken', activity:'Vrije keuze', emoji:'📚', info:{doel:'Vrij spelen, herhalen of samen lezen.',materialen:'Vrij te kiezen.',voorbereiding:'Geen vaste voorbereiding.',stappen:'Kies samen iets rustigs of creatiefs.',vragen:'Wat wil je vandaag doen?',aanpassing35:'Laat kiezen uit twee opties.',aanpassing2:'Laat meedoen op eigen niveau.',baby:'Vrij meedoen.',duur:'30–60 minuten.',extra:'Ga naar buiten.',laagenergie:'Boekjes lezen.'}},
  Zondag:{title:'❤️ Samen & rustig + fruit + drinken', activity:'Rustige gezinsactiviteit', emoji:'❤️', info:{doel:'Rust, verbinding en samen zijn.',materialen:'Boekjes, muziek of knutselmateriaal.',voorbereiding:'Kies één rustige activiteit.',stappen:'Doe samen iets zonder prestatiedoel.',vragen:'Wat vond je deze week leuk?',aanpassing35:'Laat vertellen.',aanpassing2:'Laat aanwijzen/kiezen.',baby:'Knuffelen/meekijken.',duur:'30–60 minuten.',extra:'Korte wandeling.',laagenergie:'Samen op de bank lezen.'}}
};

const baseSchedule=[
['07:30–08:00','🌞 Opstaan + warme melk','Rustig wakker worden en warme melk.','🌞'],
['08:00–08:30','🚿 Wassen, aankleden, tanden poetsen, haren','Ochtendverzorging.','🚿'],
['08:30–09:00','🍳 Ontbijt samen','Samen ontbijten.','🍳'],
['09:00–09:15','❤️ 1-op-1 mem-tijd – kind 1','Korte onverdeelde aandacht.','❤️'],
['09:15–09:30','❤️ 1-op-1 mem-tijd – kind 2','Korte onverdeelde aandacht.','❤️'],
['09:30–09:45','❤️ 1-op-1 mem-tijd – baby','Korte onverdeelde aandacht.','❤️'],
['09:45–10:45','LEARNING','LEARNING','📚'],
['10:45–11:30','🌳 Buitenactiviteit','Buiten bewegen of ontdekken.','🌳'],
['11:30–12:00','🧸 Vrij spelen + lunch klaarmaken','Kinderen spelen, mem bereidt lunch.','🧸'],
['12:00–12:45','🍚 Warme lunch','📎 Open voor recept en voorbereiding.','🍚'],
['12:45–13:00','🛏️ Kinderen naar bed brengen','Rustige overgang naar slaap/rust.','🛏️'],
['13:00–13:30','🧹 Opruimen + keuken aan kant maken','Korte reset van huis en keuken.','🧹'],
['13:30–14:00','❤️ 1-op-1 mem-tijd met kind 1','Rustige individuele tijd.','❤️'],
['14:00–15:00','🧩 Rustig spelen / boekjes / luisterboek','Rustmoment.','🧩'],
['15:00–15:30','🥪 Broodje eten + drinken','Tussendoortje.','🥪'],
['15:30–16:30','🎨 Gezamenlijke activiteit','📎 Open voor activiteit van de dag.','🎨'],
['16:30–17:30','🌳 Buiten spelen / zwembad / wandelen','Buitenmoment.','🌳'],
['17:30–18:30','🧸 Vrij spelen + helpen met koken','Kinderen spelen of helpen.','🧸'],
['18:30–19:00','🍽️ Gezamenlijk warm eten','📎 Open voor recept en voorbereiding.','🍽️'],
['19:00–19:30','🧹 Opruimen binnen + buiten spelen met papa','Avondreset.','🧹'],
['19:30–20:00','🛁 Bad/douche + pyjama + tanden poetsen','Avondverzorging.','🛁'],
['20:00–20:30','📖 Boekje + knuffelen + rustig worden','Rustige afsluiting.','📖'],
['20:30','🌙 Slapen','Bedtijd.','🌙']
];

const defaultExtras={
 '🍚 Warme lunch':{titel:'Warme lunch',type:'recipe',recept:'Voorbeeld: rijst met ei en groenten',ingredienten:'Rijst\nEi\nGroenten\nOlijfolie',bereiding:'1. Kook de rijst.\n2. Bak of roer het ei.\n3. Voeg zachte groenten toe.\n4. Meng en serveer kindvriendelijk.',voorbereiding:'Groenten kunnen in de ochtend alvast gesneden worden.'},
 '🎨 Gezamenlijke activiteit':{titel:'Gezamenlijke activiteit',type:'activity',recept:'Vandaag kies je hier een creatieve activiteit.',ingredienten:'Knutselmateriaal naar keuze.',bereiding:'Open dit blok en pas de activiteit per dag aan.',voorbereiding:'Leg materiaal vooraf klaar.'},
 '🍽️ Gezamenlijk warm eten':{titel:'Avondeten',type:'recipe',recept:'Voorbeeld: pasta met groenten en vlees',ingredienten:'Pasta\nGroenten\nVlees of alternatief\nTomatensaus',bereiding:'1. Kook de pasta.\n2. Bereid groente en vlees.\n3. Meng met saus.\n4. Serveer.',voorbereiding:'Saus kan eerder op de dag gemaakt worden.'}
};


let state=JSON.parse(localStorage.getItem('onsGezinV2')||'null');
if(!state){state={selectedDay:'Maandag',done:{},custom:{}}}
function save(){localStorage.setItem('onsGezinV2',JSON.stringify(state))}
function rowsFor(day){return baseSchedule.map((r,i)=>{
  if(r[1]==='LEARNING') return {time:r[0],title:learning[day].title,detail:learning[day].activity,emoji:learning[day].emoji,key:`${day}-${i}`,kind:'learning'};
  return {time:r[0],title:r[1],detail:r[2],emoji:r[3],key:`${day}-${i}`,kind:'normal'};
})}

function renderDays(container, onClick){container.innerHTML=''; dayNames.forEach(d=>{let b=document.createElement('button');b.textContent=d;b.className=d===state.selectedDay?'active':'';b.onclick=()=>{state.selectedDay=d;save();onClick();renderAllDays()};container.appendChild(b)})}
function renderAllDays(){renderDays(document.getElementById('days'),renderParent);renderDays(document.getElementById('childDays'),renderChild)}

function hasExtra(row){return row.kind==='learning'||['🍚 Warme lunch','🎨 Gezamenlijke activiteit','🍽️ Gezamenlijk warm eten'].includes(row.title)}
function customKey(day,title){return day+'|'+title}


function renderParent(){
 const wrap=document.getElementById('schedule');wrap.innerHTML='';
 rowsFor(state.selectedDay).forEach(row=>{
   const el=document.createElement('div');el.className='row'+(state.done[row.key]?' completed':'');
   const t=document.createElement('div');t.className='time';t.textContent=row.time;
   const c=document.createElement('div');
   const tt=document.createElement('div');tt.className='title';tt.textContent=row.title;
   const dd=document.createElement('div');dd.className='detail';dd.textContent=row.detail;
   c.append(tt,dd);
   el.append(t,c);
   if(hasExtra(row)){const p=document.createElement('button');p.className='paperclip';p.textContent='📎';p.title='Extra informatie';p.onclick=()=>openExtra(state.selectedDay,row);el.appendChild(p)}else{const spacer=document.createElement('span');el.appendChild(spacer)}
   const chk=document.createElement('input');chk.type='checkbox';chk.className='done';chk.checked=!!state.done[row.key];chk.onchange=()=>{state.done[row.key]=chk.checked;save();renderParent();renderChild()};el.appendChild(chk);
   wrap.appendChild(el);
 });
}

function extraData(day,row){
 const ck=customKey(day,row.title);
 if(state.custom[ck]) return state.custom[ck];
 if(row.kind==='learning') return {titel:learning[day].activity,type:'learning',...learning[day].info};
 return {...defaultExtras[row.title]};
}

function openExtra(day,row){
 const d=extraData(day,row);document.getElementById('sheetTitle').textContent=`📎 ${row.title}`;
 const box=document.getElementById('sheetContent'); box.innerHTML='';
 if(row.kind==='learning'){
   const fields=[['🎯 Doel','doel'],['🧺 Materialen','materialen'],['👣 Voorbereiding','voorbereiding'],['▶️ Stap voor stap','stappen'],['💬 Vragen','vragen'],['👧 3,5 jaar','aanpassing35'],['👶 2 jaar','aanpassing2'],['👶 Baby','baby'],['⏱️ Duur','duur'],['⭐ Extra','extra'],['🔋 Lage-energie alternatief','laagenergie']];
   const grid=document.createElement('div');grid.className='infoGrid';
   fields.forEach(([lab,k])=>{const b=document.createElement('div');b.className='infoBlock';b.innerHTML=`<h3>${lab}</h3><p>${(d[k]||'')}</p>`;grid.appendChild(b)});box.appendChild(grid);
 }else{
   const ck=customKey(day,row.title);
   box.innerHTML=`<div class='grid2'>
   <div><label>Titel / gerecht / activiteit</label><input id='f1' value='${escapeHtml(d.recept||'')}'></div>
   <div><label>Voorbereiding</label><textarea id='f2'>${escapeHtml(d.voorbereiding||'')}</textarea></div>
   <div><label>Ingrediënten / materialen</label><textarea id='f3'>${escapeHtml(d.ingredienten||'')}</textarea></div>
   <div><label>Bereiding / uitleg</label><textarea id='f4'>${escapeHtml(d.bereiding||'')}</textarea></div>
   </div><div class='actions' style='margin-top:12px'><button id='saveExtra'>💾 Opslaan</button></div><p class='small'>Deze informatie blijft op dit apparaat bewaard. Cloud-synchronisatie voegen we in een volgende stap toe.</p>`;
   setTimeout(()=>{document.getElementById('saveExtra').onclick=()=>{state.custom[ck]={...d,recept:document.getElementById('f1').value,voorbereiding:document.getElementById('f2').value,ingredienten:document.getElementById('f3').value,bereiding:document.getElementById('f4').value};save();closeDrawer();renderParent()}},0)
 }
 document.getElementById('drawer').classList.add('open');
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}

function renderChild(){
 const rows=rowsFor(state.selectedDay); let idx=rows.findIndex(r=>!state.done[r.key]); if(idx<0) idx=rows.length-1; const r=rows[idx];
 document.getElementById('childEmoji').textContent=r.emoji;document.getElementById('childTime').textContent=r.time;document.getElementById('childTitle').textContent=r.title.replace(/^\S+\s/,'');
 const next=rows[idx+1];document.getElementById('childNext').textContent=next?`Hierna: ${next.title}`:'Alles voor vandaag is klaar 🎉';
 document.getElementById('childDone').onclick=()=>{state.done[r.key]=true;save();renderChild();renderParent()}
}

document.getElementById('parentBtn').onclick=()=>{document.getElementById('parentPanel').classList.add('active');document.getElementById('childPanel').classList.remove('active');parentBtn.classList.add('active');childBtn.classList.remove('active')}
document.getElementById('childBtn').onclick=()=>{document.getElementById('childPanel').classList.add('active');document.getElementById('parentPanel').classList.remove('active');childBtn.classList.add('active');parentBtn.classList.remove('active');renderChild()}
document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()}
document.getElementById('resetDay').onclick=()=>{rowsFor(state.selectedDay).forEach(r=>delete state.done[r.key]);save();renderParent();renderChild()}
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ons-gezin-planning.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{state=JSON.parse(rd.result);save();renderAllDays();renderParent();renderChild()}catch{alert('Dit bestand kon niet worden gelezen.')}};rd.readAsText(f)}

renderAllDays();renderParent();renderChild();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>

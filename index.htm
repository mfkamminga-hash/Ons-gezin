<!doctype html><html lang='nl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Ons Gezin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#faf7f2;color:#2b2927}header{position:sticky;top:0;background:#fff;padding:16px;box-shadow:0 1px 8px #0001;z-index:2}.top{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}.btn,button{border:0;border-radius:14px;padding:11px 14px;background:#eee7dc;font-weight:700}.primary{background:#2f6f61;color:#fff}.wrap{max-width:900px;margin:auto;padding:14px}.days{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.day{white-space:nowrap}.day.active{background:#2f6f61;color:#fff}.status{font-size:13px;padding:8px 0;color:#666}.card{background:#fff;border-radius:18px;margin:10px 0;padding:14px;box-shadow:0 2px 10px #0000000d;display:grid;grid-template-columns:84px 1fr 44px;gap:10px;align-items:center}.time{font-weight:800;color:#725e4b}.title{font-weight:750}.done{opacity:.45;text-decoration:line-through}.check{width:34px;height:34px}.child .card{grid-template-columns:110px 1fr 64px;padding:24px;font-size:24px}.child .time{font-size:18px}.child h1{font-size:30px}.child .days{display:none}.login{display:flex;gap:8px;align-items:center}.small{font-size:12px;color:#777}@media(max-width:520px){.card{grid-template-columns:72px 1fr 40px}.top{align-items:flex-start;flex-wrap:wrap}}</style></head><body>
<header><div class='top'><div><h1>🌈 Ons Gezin</h1><div class='small' id='subtitle'>Weekplanner</div></div><div class='login'><button id='mode'>👧 Kindmodus</button><button class='primary' id='login'>Google login</button></div></div></header>
<main class='wrap'><div class='days' id='days'></div><div class='status' id='status'>Verbinden met Firebase…</div><div id='list'></div></main>
<script type='module'>
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getFirestore,doc,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCMh0bK-TNHFIUUJjdx7BxXPz7kwhlC0Oc',authDomain:'ons-gezin-f18a2.firebaseapp.com',projectId:'ons-gezin-f18a2',storageBucket:'ons-gezin-f18a2.firebasestorage.app',messagingSenderId:'903841601204',appId:'1:903841601204:web:a3957b20a842ccfc23e9e1'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const names=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
const learn=['🧮 Rekenen – Kleuren','🇬🇧 Engels – Colours','🙏 Godsdienst – God maakte de kleuren','🇪🇸 Spaans – Los colores','🔬 Ontdekken – Kleuren mengen','🎲 Vrij leren / samen spelen','📚 Voorlezen & rustig ontdekken'];
const base=[['07:30–08:00','🌞 Opstaan + warme melk'],['08:00–08:30','🚿 Wassen, aankleden, tanden poetsen, haren'],['08:30–09:00','🍳 Ontbijt samen'],['09:00–09:15','❤️ 1-op-1 mem-tijd – kind 1'],['09:15–09:30','❤️ 1-op-1 mem-tijd – kind 2'],['09:30–09:45','❤️ 1-op-1 mem-tijd – baby'],['09:45–10:45','LEARN'],['10:45–11:30','🌳 Buitenactiviteit'],['11:30–12:00','🧸 Vrij spelen + lunch klaarmaken'],['12:00–12:45','🍚 Warme lunch'],['12:45–13:00','🛏️ Kinderen naar bed brengen'],['13:00–13:30','🧹 Opruimen + keuken aan kant maken'],['13:30–14:00','❤️ 1-op-1 mem-tijd met kind 1'],['14:00–15:00','🧩 Rustig spelen / boekjes / luisterboek'],['15:00–15:30','🥪 Broodje eten + drinken'],['15:30–16:30','🎨 Gezamenlijke activiteit'],['16:30–17:30','🌳 Buiten spelen / zwembad / wandelen'],['17:30–18:30','🧸 Vrij spelen + helpen met koken'],['18:30–19:00','🍽️ Gezamenlijk warm eten'],['19:00–19:30','🧹 Opruimen binnen + buiten spelen met papa'],['19:30–20:00','🛁 Bad/douche + pyjama + tanden poetsen'],['20:00–20:30','📖 Boekje + knuffelen + rustig worden'],['20:30','🌙 Slapen']];
let day=(new Date().getDay()+6)%7, child=false, state={done:{}} , unsub=null;
const $=id=>document.getElementById(id);function key(i){return day+'-'+i}function render(){ $('days').innerHTML=names.map((n,i)=>`<button class="day ${i===day?'active':''}" data-i="${i}">${n}</button>`).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{day=+b.dataset.i;render()});$('list').innerHTML=base.map((x,i)=>{let t=x[1]==='LEARN'?learn[day]:x[1],d=!!state.done[key(i)];return `<div class="card ${d?'done':''}"><div class="time">${x[0]}</div><div class="title">${t}</div><input class="check" type="checkbox" data-i="${i}" ${d?'checked':''}></div>`}).join('');document.querySelectorAll('.check').forEach(c=>c.onchange=async()=>{state.done[key(+c.dataset.i)]=c.checked;render();await save()});}
async function save(){if(!auth.currentUser)return;await setDoc(doc(db,'families',auth.currentUser.uid),state,{merge:true});}
$('mode').onclick=()=>{child=!child;document.body.classList.toggle('child',child);$('mode').textContent=child?'👩 Oudermodus':'👧 Kindmodus';$('subtitle').textContent=child?names[day]:'Weekplanner';render()};
$('login').onclick=async()=>{try{if(auth.currentUser)await signOut(auth);else await signInWithPopup(auth,provider)}catch(e){$('status').textContent='Login mislukt: '+e.message}};
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}if(!u){$('login').textContent='Google login';$('status').textContent='Log in om telefoon en Newline te synchroniseren.';render();return}$('login').textContent='Uitloggen';$('status').textContent='☁️ Synchronisatie actief';unsub=onSnapshot(doc(db,'families',u.uid),s=>{if(s.exists())state={done:{},...s.data()};render()},e=>$('status').textContent='Synchronisatiefout: '+e.message)});render();
</script></body></html>
